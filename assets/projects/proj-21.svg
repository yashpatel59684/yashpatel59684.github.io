<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#172554"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>
      <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="transparent"/>
        <stop offset="100%" stop-color="#020617" stop-opacity="0.9"/>
      </linearGradient>
      <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
        <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      </pattern>
    </defs>
    
    <rect width="600" height="340" fill="url(#bgGrad)"/>
    <rect width="600" height="340" fill="url(#grid)"/>
    <rect width="600" height="340" fill="url(#overlay)"/>
    
    <!-- Geometric decorative icon in background -->
    <circle cx="500" cy="80" r="120" fill="#38bdf8" opacity="0.08"/>
    <polygon points="460,40 540,80 460,120" fill="#38bdf8" opacity="0.15"/>
    
    <!-- Top Tags -->
    <rect x="30" y="28" width="85" height="24" rx="12" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)"/>
    <text x="72" y="44" fill="#38bdf8" font-family="monospace, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Mobile &amp; RMG</text>
    
    <!-- Title & Studio -->
    <text x="30" y="170" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold" letter-spacing="-0.5">Matific Galaxy (Card Counter)</text>
    <text x="30" y="202" fill="#38bdf8" font-family="monospace, sans-serif" font-size="13" font-weight="600">Vasundhara Infotech</text>
    
    <!-- Platforms bar -->
    <rect x="30" y="260" width="540" height="1" fill="rgba(255,255,255,0.1)"/>
    <text x="30" y="288" fill="#94a3b8" font-family="monospace, sans-serif" font-size="11">Android</text>
    <text x="570" y="288" fill="#38bdf8" font-family="monospace, sans-serif" font-size="11" font-weight="bold" text-anchor="end">Yash Patel • Unity Dev</text>
  </svg>